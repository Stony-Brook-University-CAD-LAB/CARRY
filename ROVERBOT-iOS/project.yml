# Fallback: if Xcode refuses the hand-written .xcodeproj, regenerate it with XcodeGen:
#   brew install xcodegen && xcodegen generate
name: ROVERBOT
options:
  bundleIdPrefix: edu.stonybrook.ece
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  ROVERBOT:
    type: application
    platform: iOS
    sources: [ROVERBOT]
    info:
      path: Config/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.stonybrook.ece.roverbot
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
